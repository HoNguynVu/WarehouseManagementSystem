name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release
  REGISTRY: ghcr.io

jobs:
  build-project:
    name: Build .NET solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WarehouseManagementSystem.sln

      - name: Build
        run: dotnet build WarehouseManagementSystem.sln --configuration ${{ env.CONFIGURATION }} --no-restore

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service images
        run: |
          docker build -f Services/ApiGateway/Dockerfile -t wms/api-gateway:ci .
          docker build -f Services/IdentityService/API/Dockerfile -t wms/identity-service:ci .
          docker build -f Services/CatalogService/API/Dockerfile -t wms/catalog-service:ci .
          docker build -f Services/WarehouseService/API/Dockerfile -t wms/warehouse-service:ci .
          docker build -f Services/OrderService/API/Dockerfile -t wms/order-service:ci .

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore WarehouseManagementSystem.sln

      - name: Test
        run: dotnet test WarehouseManagementSystem.sln --configuration ${{ env.CONFIGURATION }} --no-restore --logger trx

  push-docker:
    name: Push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -f Services/ApiGateway/Dockerfile -t $REGISTRY/$IMAGE_NAMESPACE/api-gateway:${{ github.sha }} -t $REGISTRY/$IMAGE_NAMESPACE/api-gateway:latest .
          docker push $REGISTRY/$IMAGE_NAMESPACE/api-gateway:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAMESPACE/api-gateway:latest

          docker build -f Services/IdentityService/API/Dockerfile -t $REGISTRY/$IMAGE_NAMESPACE/identity-service:${{ github.sha }} -t $REGISTRY/$IMAGE_NAMESPACE/identity-service:latest .
          docker push $REGISTRY/$IMAGE_NAMESPACE/identity-service:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAMESPACE/identity-service:latest

          docker build -f Services/CatalogService/API/Dockerfile -t $REGISTRY/$IMAGE_NAMESPACE/catalog-service:${{ github.sha }} -t $REGISTRY/$IMAGE_NAMESPACE/catalog-service:latest .
          docker push $REGISTRY/$IMAGE_NAMESPACE/catalog-service:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAMESPACE/catalog-service:latest

          docker build -f Services/WarehouseService/API/Dockerfile -t $REGISTRY/$IMAGE_NAMESPACE/warehouse-service:${{ github.sha }} -t $REGISTRY/$IMAGE_NAMESPACE/warehouse-service:latest .
          docker push $REGISTRY/$IMAGE_NAMESPACE/warehouse-service:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAMESPACE/warehouse-service:latest

          docker build -f Services/OrderService/API/Dockerfile -t $REGISTRY/$IMAGE_NAMESPACE/order-service:${{ github.sha }} -t $REGISTRY/$IMAGE_NAMESPACE/order-service:latest .
          docker push $REGISTRY/$IMAGE_NAMESPACE/order-service:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAMESPACE/order-service:latest

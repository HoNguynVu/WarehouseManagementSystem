version: '3.8'

services:
  # ---------------- INFRASTRUCTURE ----------------
  # 1. RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: wms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # 2. Redis Cache
  redis:
    image: redis:alpine
    container_name: wms-redis
    ports:
      - "6379:6379"
    restart: always

  # 3. PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASS}
      POSTGRES_DB: warehouse_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 4. MongoDB database
  mongodb:
    image: mongo:latest
    container_name: wms-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASS}
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    restart: always

  # 5. SQL Server for IdentityService
  identity_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wms-identity-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_IDENTITY_SQL_PASS}
    ports:
      - "1434:1433"
    volumes:
      - identity_sqldata:/var/opt/mssql
    restart: always

  # 6. SQL Server for OrderService
  order_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wms-order-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_ORDER_SQL_PASS}
    ports:
      - "1435:1433"
    volumes:
      - order_sqldata:/var/opt/mssql
    restart: always

  # 7. Centralized logging UI
  seq:
    image: datalust/seq:latest
    container_name: wms-seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - seqdata:/data
    restart: always

  # ---------------- MICROSERVICES ----------------
  
  identity-service:
    build:
      context: .
      dockerfile: Services/IdentityService/API/Dockerfile
    container_name: identity-service
    restart: always
    ports:
      - "5066:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Server=wms-identity-sqlserver;Database=IdentityDb;User Id=sa;Password=Vudz1234;TrustServerCertificate=True;
      - Seq__ServerUrl=http://wms-seq:5341
    depends_on:
      - identity_sqlserver
      - seq

  catalog-service:
    build:
      context: .
      dockerfile: Services/CatalogService/API/Dockerfile
    container_name: catalog-service
    restart: always
    ports:
      - "5258:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbSettings__ConnectionString=mongodb://admin:123@wms-mongodb:27017/?authSource=admin
      - RabbitMQ__Host=wms-rabbitmq
      - Redis__Host=wms-redis:6379
      - Seq__ServerUrl=http://wms-seq:5341
    depends_on:
      - mongodb
      - rabbitmq
      - redis
      - seq

  order-service:
    build:
      context: .
      dockerfile: Services/OrderService/API/Dockerfile
    container_name: order-service
    restart: always
    ports:
      - "5184:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=wms-order-sqlserver;Database=OrderDb;User Id=sa;Password=Vudz1234;TrustServerCertificate=True
      - RabbitMQ__Host=wms-rabbitmq
      - Seq__ServerUrl=http://wms-seq:5341
    depends_on:
      - order_sqlserver
      - rabbitmq
      - seq

  warehouse-service:
    build:
      context: .
      dockerfile: Services/WarehouseService/API/Dockerfile
    container_name: warehouse-service
    restart: always
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WarehouseDb=Host=wms-postgres;Port=5432;Database=warehouse_db;Username=admin;Password=123
      - RabbitMQ__Host=wms-rabbitmq
      - Redis__Host=wms-redis:6379
      - Seq__ServerUrl=http://wms-seq:5341
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - seq

  api-gateway:
    build:
      context: .
      dockerfile: Services/ApiGateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Seq__ServerUrl=http://wms-seq:5341
      - HealthChecks__RabbitMQ=amqp://guest:guest@wms-rabbitmq:5672
      - HealthChecks__Redis=wms-redis:6379
      - HealthChecks__MongoDB=mongodb://admin:123@wms-mongodb:27017/?authSource=admin
      - HealthChecks__PostgreSQL=Host=wms-postgres;Port=5432;Database=warehouse_db;Username=admin;Password=123
      - HealthChecks__SQLOrder=Server=wms-order-sqlserver;Database=OrderDb;User Id=sa;Password=Vudz1234;TrustServerCertificate=True
      - HealthChecks__SQLIdentity=Server=wms-identity-sqlserver;Database=master;User Id=sa;Password=Vudz1234;TrustServerCertificate=True
      - ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address=http://identity-service:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address=http://catalog-service:8080
      - ReverseProxy__Clusters__warehouse-cluster__Destinations__destination1__Address=http://warehouse-service:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address=http://order-service:8080
    depends_on:
      - identity-service
      - catalog-service
      - order-service
      - warehouse-service
      - seq

volumes:
  pgdata:
  mongodata:
  identity_sqldata:
  order_sqldata:
  seqdata:
